<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WealthSim — Build Your Future</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    #loading { position: fixed; inset: 0; background: #0a1628; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.8s ease; }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    #loading h1 { font-family: Georgia, serif; font-size: 2.5rem; color: #e2a840; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    #loading p { font-family: Arial, sans-serif; font-size: 0.9rem; color: #4a6080; margin-bottom: 2rem; }
    #loading-bar-bg { width: 280px; height: 4px; background: #1a2744; border-radius: 2px; overflow: hidden; }
    #loading-bar { height: 100%; background: linear-gradient(90deg, #e2a840, #f0c060); border-radius: 2px; width: 0%; transition: width 0.3s ease; }
    #loading-hint { margin-top: 1rem; font-family: Arial, sans-serif; font-size: 0.75rem; color: #2a3a5a; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>WealthSim</h1>
    <p>Build Your Future</p>
    <div id="loading-bar-bg"><div id="loading-bar"></div></div>
    <p id="loading-hint">Loading city...</p>
  </div>
  <div id="game-container"></div>
  <script>
    let currentLang = 'en';
    function t(key) { return key; }
    function setLang(lang) { currentLang = lang; }
  </script>
  <script>
    const ScoringEngine = {
      decisions: [], startingAnswers: [], levelStartTime: null,
      reset() { this.decisions = []; this.startingAnswers = []; },
      startTimer() { this.levelStartTime = Date.now(); },
      recordDecision(level, value, extra = {}) {
        const elapsed = this.levelStartTime ? Date.now() - this.levelStartTime : null;
        this.decisions.push({ level, value, elapsed, ...extra });
        console.log('[WealthSim] Level ' + level + ': ' + value + ' (' + elapsed + 'ms)');
      },
      recordStartingAnswer(idx, value) { this.startingAnswers[idx] = value; }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="js/city/District.js"></script>
  <script src="js/city/ResourceCube.js"></script>
  <script src="js/city/AmbientSystem.js"></script>
  <script src="js/city/WeatherSystem.js"></script>
  <script src="js/ui/TooltipManager.js"></script>
  <script src="js/ui/HUD.js"></script>
  <script src="js/scenes/Boot.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/main.js"></script>
  <script>
    let loadProgress = 0;
    const bar = document.getElementById('loading-bar');
    const hint = document.getElementById('loading-hint');
    const hints = ['Building districts...', 'Placing roads...', 'Planting trees...', 'Lighting the city...'];
    let hintIdx = 0;
    const hintTimer = setInterval(() => {
      loadProgress = Math.min(loadProgress + 15, 85);
      bar.style.width = loadProgress + '%';
      hint.textContent = hints[hintIdx % hints.length];
      hintIdx++;
    }, 400);
    window.addEventListener('load', () => {
      setTimeout(() => {
        clearInterval(hintTimer);
        bar.style.width = '100%';
        setTimeout(() => {
          document.getElementById('loading').classList.add('fade-out');
          setTimeout(() => document.getElementById('loading').remove(), 800);
        }, 400);
      }, 1800);
    });
  </script>
</body>
</html>
