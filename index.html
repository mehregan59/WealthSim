<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WealthSim — Build Your Future</title>
  <!-- Preconnect for fast font load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load fonts before game starts so Phaser text renders crisp -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
    #game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    canvas{display:block;image-rendering:auto;}
    #loading{position:fixed;inset:0;background:#060e1c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.8s ease}
    #loading.out{opacity:0;pointer-events:none}
    #loading h1{font-family:'Playfair Display',Georgia,serif;font-size:2.4rem;color:#e2a840;margin-bottom:.4rem;letter-spacing:.06em}
    #loading p{font-family:'Inter',Arial,sans-serif;font-size:.88rem;color:#4a6080;margin-bottom:1.8rem}
    #lbar-bg{width:260px;height:4px;background:#1a2744;border-radius:2px;overflow:hidden}
    #lbar{height:100%;background:linear-gradient(90deg,#e2a840,#f0c060);border-radius:2px;width:0%;transition:width .3s ease}
    #lhint{margin-top:.9rem;font-family:'Inter',Arial,sans-serif;font-size:.72rem;color:#2a3a5a}
  </style>
</head>
<body>
  <div id="loading">
    <h1>WealthSim</h1>
    <p>Build Your Future</p>
    <div id="lbar-bg"><div id="lbar"></div></div>
    <p id="lhint">Loading city...</p>
  </div>
  <div id="game-container"></div>

  <script>
    let currentLang = 'en';
    function t(k){return k;}
    function setLang(l){currentLang=l;}
    window.playerInfo = {};
    window.retirementContext = {};
  </script>
  <script>
    const ScoringEngine = {
      decisions:[],startingAnswers:[],levelStartTime:null,
      reset(){this.decisions=[];this.startingAnswers=[];},
      startTimer(){this.levelStartTime=Date.now();},
      recordDecision(level,value,extra={}){
        const elapsed=this.levelStartTime?Date.now()-this.levelStartTime:null;
        this.decisions.push({level,value,elapsed,...extra});
        console.log('[WealthSim] L'+level+': '+value+' ('+elapsed+'ms)');
      },
      recordStartingAnswer(idx,value){
        this.startingAnswers[idx]=value;
        console.log('[WealthSim] Q'+idx+': '+value);
      }
    };
  </script>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- City systems -->
  <script src="js/city/District.js"></script>
  <script src="js/city/RoadNetwork.js"></script>
  <script src="js/city/ResourceCube.js"></script>
  <script src="js/city/AmbientSystem.js"></script>
  <script src="js/city/WeatherSystem.js"></script>

  <!-- UI -->
  <script src="js/ui/TooltipManager.js"></script>
  <script src="js/ui/HUD.js"></script>
  <script src="js/ui/StatsPanel.js"></script>
  <script src="js/ui/WorldButton.js"></script>

  <!-- Scenes -->
  <script src="js/scenes/Boot.js"></script>
  <script src="js/scenes/PlayerSetup.js"></script>
  <script src="js/scenes/RetirementContext.js"></script>
  <script src="js/scenes/StartingQuestions.js"></script>
  <script src="js/scenes/GameScene.js"></script>

  <!-- Game config -->
  <script src="js/main.js"></script>

  <!-- Loading bar — waits for fonts + scripts -->
  <script>
    let lp=0;
    const bar=document.getElementById('lbar'),hint=document.getElementById('lhint');
    const hints=['Building districts...','Paving roads...','Planting trees...','Lighting the city...','Wiring the grid...'];
    let hi=0;
    const lt=setInterval(()=>{lp=Math.min(lp+14,88);bar.style.width=lp+'%';hint.textContent=hints[hi%hints.length];hi++;},380);
    // Wait for both window load and fonts
    Promise.all([
      new Promise(r=>window.addEventListener('load',r)),
      document.fonts.ready
    ]).then(()=>{
      setTimeout(()=>{
        clearInterval(lt);bar.style.width='100%';
        setTimeout(()=>{
          document.getElementById('loading').classList.add('out');
          setTimeout(()=>document.getElementById('loading').remove(),900);
        },350);
      },800);
    });
  </script>
</body>
</html>
